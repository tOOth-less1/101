<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>image 1</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-glow: linear-gradient(135deg, #6366f1, #a855f7);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem;
    }

    .preview-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 1rem;
      width: 100%;
      max-width: 360px;
      max-height: calc(100dvh - 1.5rem);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .image-frame {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      aspect-ratio: 9 / 16;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
      background: rgba(0, 0, 0, 0.3);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .preview-card:hover .image-frame img {
      transform: scale(1.02);
    }

    .info-header {
      text-align: center;
      flex-shrink: 0;
    }

    .title {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .download-btn {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 12px;
      background: var(--accent-glow);
      color: #ffffff;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.35);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .download-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .download-btn:active {
      transform: translateY(0);
    }

    .download-btn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .next-btn {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .next-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    .next-btn:active {
      transform: translateY(0);
    }

    .next-btn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>

  <div class="preview-card">
    <div class="image-frame">
      <img id="previewImage" src="images/photo1.png" alt="Preview 1">
    </div>

    <div class="info-header">
      <h2 class="title">Visual Preview</h2>
      <p class="subtitle">9:16 Portrait Aspect Ratio</p>
    </div>

    <button class="download-btn" id="downloadBtn">
      <svg viewBox="0 0 24 24">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Download File
    </button>

    <!-- NEXT BUTTON -->
    <button class="next-btn" id="nextBtn" onclick="window.location.href='image 2.html'">
      Next Image
      <svg viewBox="0 0 24 24">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>
  </div>

  <!-- AUDIO PERSISTENCE -->
  <audio id="bg-audio" preload="auto">
      <source src="songs/bg1.mp3" type="audio/mpeg">
  </audio>

  <script>
    const TARGET_FILE_URL = "images/photo1.png";
    const DOWNLOAD_FILENAME = 'photo1.png';

    // Continuous music sync
    const audio = document.getElementById('bg-audio');
    audio.volume = 0.15;
    const savedTime = localStorage.getItem('bgAudioTime');
    const savedPlaying = localStorage.getItem('bgAudioPlaying');
    if (savedTime) audio.currentTime = parseFloat(savedTime);
    if (savedPlaying === 'true') {
        audio.play().catch(e => console.log('Autoplay prevented:', e));
    }

    window.addEventListener('beforeunload', () => {
        localStorage.setItem('bgAudioTime', audio.currentTime);
        localStorage.setItem('bgAudioPlaying', !audio.paused);
    });

    setInterval(() => {
        if (!audio.paused) {
            localStorage.setItem('bgAudioTime', audio.currentTime);
            localStorage.setItem('bgAudioPlaying', 'true');
        }
    }, 500);

    // Download handler with "Save As" location picker prompt
    document.getElementById('downloadBtn').addEventListener('click', async () => {
      const button = document.getElementById('downloadBtn');
      const originalText = button.innerHTML;

      try {
        button.innerText = 'Saving...';
        button.style.opacity = '0.7';

        const response = await fetch(TARGET_FILE_URL);
        const blob = await response.blob();

        // Check if the browser supports the File System Access API
        if ('showSaveFilePicker' in window) {
          const handle = await window.showSaveFilePicker({
            suggestedName: DOWNLOAD_FILENAME,
            types: [{
              description: 'Image Files',
              accept: { 'image/png': ['.png'] }
            }]
          });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
        } else {
          // Fallback if browser doesn't support showSaveFilePicker
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = DOWNLOAD_FILENAME;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(link.href);
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          // Fallback link click if fetch or picker fails
          const link = document.createElement('a');
          link.href = TARGET_FILE_URL;
          link.download = DOWNLOAD_FILENAME;
          link.target = '_blank';
          link.click();
        }
      } finally {
        button.innerHTML = originalText;
        button.style.opacity = '1';
      }
    });
  </script>
</body>
</html>
