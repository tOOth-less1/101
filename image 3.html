<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>image 2</title>
  <style>
    :root {
      --bg-void: #030408;
      --cyber-cyan: #00f3ff;
      --cyber-pink: #ff0055;
      --text-main: #ffffff;
      --text-muted: rgba(0, 243, 255, 0.7);
      --hud-panel: rgba(5, 10, 20, 0.85);
      --hud-border: rgba(0, 243, 255, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-void);
      font-family: 'SF Mono', 'Fira Code', 'Courier New', Consolas, monospace;
    }

    .ambient-glow {
      position: absolute;
      inset: -10%;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(255, 0, 85, 0.15), transparent 60%),
        radial-gradient(circle at 80% 20%, rgba(0, 243, 255, 0.2), transparent 50%),
        url('https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=1080&q=80');
      background-size: cover;
      background-position: center;
      filter: blur(80px) brightness(0.4) contrast(1.3);
      transform: scale(1.1);
      z-index: 0;
    }

    .scanlines {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 0, 0, 0.3) 50%,
        rgba(0, 0, 0, 0.3)
      );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 2;
      opacity: 0.6;
    }

    .stage {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }

    .media-card {
      position: relative;
      height: calc(100dvh - 2.5rem);
      aspect-ratio: 9 / 16;
      max-width: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--hud-border);
      box-shadow: 
        0 0 35px rgba(0, 243, 255, 0.2),
        inset 0 0 15px rgba(0, 243, 255, 0.1);
      background: #000;
    }

    .media-card::before, .media-card::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border: 2px solid var(--cyber-cyan);
      z-index: 3;
      pointer-events: none;
    }
    .media-card::before { top: 12px; left: 12px; border-right: none; border-bottom: none; }
    .media-card::after { top: 12px; right: 12px; border-left: none; border-bottom: none; }

    .media-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: contrast(1.05) saturate(1.1);
    }

    .overlay-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 2rem 1.25rem 1.25rem;
      background: linear-gradient(
        to top, 
        rgba(3, 4, 8, 0.95) 0%, 
        rgba(3, 4, 8, 0.6) 65%, 
        transparent 100%
      );
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      z-index: 4;
    }

    .meta-data {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      margin-bottom: 0.25rem;
    }

    .badge {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--cyber-cyan);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--cyber-pink);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--cyber-pink);
    }

    .file-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.02em;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
    }

    .download-pill {
      width: 100%;
      padding: 0.85rem 1.25rem;
      border: 1px solid var(--cyber-cyan);
      border-radius: 8px;
      background: rgba(0, 243, 255, 0.12);
      color: var(--cyber-cyan);
      font-size: 0.85rem;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      transition: all 0.2s ease;
    }

    .download-pill:hover {
      background: var(--cyber-cyan);
      color: #000;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
      transform: translateY(-1px);
    }

    .icon-wrapper {
      width: 26px;
      height: 26px;
      background: var(--cyber-cyan);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
    }

    .icon-wrapper svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2.5;
      fill: none;
    }

    .next-pill {
      width: 100%;
      padding: 0.85rem 1.25rem;
      border: 1px solid var(--cyber-pink);
      border-radius: 8px;
      background: rgba(255, 0, 85, 0.1);
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.15);
      transition: all 0.2s ease;
    }

    .next-pill:hover {
      background: var(--cyber-pink);
      color: #ffffff;
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.5);
      transform: translateY(-1px);
    }

    .next-icon-wrapper {
      width: 26px;
      height: 26px;
      background: rgba(255, 0, 85, 0.3);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    .next-icon-wrapper svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2.5;
      fill: none;
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>
  <div class="scanlines"></div>

  <main class="stage">
    <div class="media-card">
      <img id="previewImage" src="images/photo3.png" alt="Preview 3">
      
      <div class="overlay-controls">
        <div class="meta-data">
          <span class="badge">SYS // PORTRAIT 9:16</span>
          <h1 class="file-name">Editorial Artwork</h1>
        </div>

        <button class="download-pill" id="downloadBtn">
          <span id="btnText">Download Asset</span>
          <div class="icon-wrapper">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14M19 12l-7 7-7-7"/>
            </svg>
          </div>
        </button>

        <!-- NEXT IMAGE BUTTON -->
        <button class="next-pill" onclick="window.location.href='letter.html'">
          <span>a wish for you</span>
          <div class="next-icon-wrapper">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </div>
        </button>

      </div>
    </div>
  </main>

  <!-- AUDIO PERSISTENCE -->
  <audio id="bg-audio" preload="auto">
      <source src="songs/bg1.mp3" type="audio/mpeg">
  </audio>

  <script>
    const FILE_URL = 'images/photo3.png';
    const FILE_NAME = 'photo3.png';

    // Continuous music sync
    const audio = document.getElementById('bg-audio');
    audio.volume = 0.15;
    const savedTime = localStorage.getItem('bgAudioTime');
    const savedPlaying = localStorage.getItem('bgAudioPlaying');
    if (savedTime) audio.currentTime = parseFloat(savedTime);
    if (savedPlaying === 'true') {
        audio.play().catch(e => console.log('Autoplay prevented:', e));
    }

    window.addEventListener('beforeunload', () => {
        localStorage.setItem('bgAudioTime', audio.currentTime);
        localStorage.setItem('bgAudioPlaying', !audio.paused);
    });

    setInterval(() => {
        if (!audio.paused) {
            localStorage.setItem('bgAudioTime', audio.currentTime);
            localStorage.setItem('bgAudioPlaying', 'true');
        }
    }, 500);

    // Download handler with "Save As" location picker prompt
    document.getElementById('downloadBtn').addEventListener('click', async () => {
      const btnText = document.getElementById('btnText');
      const originalText = btnText.innerText;

      try {
        btnText.innerText = 'Saving...';
        
        const response = await fetch(FILE_URL);
        const blob = await response.blob();
        
        if ('showSaveFilePicker' in window) {
          const handle = await window.showSaveFilePicker({
            suggestedName: FILE_NAME,
            types: [{
              description: 'Image Files',
              accept: { 'image/png': ['.png'] }
            }]
          });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
        } else {
          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = FILE_NAME;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(blobUrl);
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          const a = document.createElement('a');
          a.href = FILE_URL;
          a.download = FILE_NAME;
          a.target = '_blank';
          a.click();
        }
      } finally {
        btnText.innerText = originalText;
      }
    });
  </script>
</body>
</html>
