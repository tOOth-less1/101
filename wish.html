<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wish</title>
    <style>
        /* 0. CORE FIX */
        * {
            box-sizing: border-box;
        }

        /* 1. MOTION GRADIENT BACKGROUND */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            overflow: hidden;
            background: linear-gradient(-45deg, #1a1a2e, #16213e, #4e31aa, #2c061f);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* MAIN CONTENT ALIGNMENT */
        .content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            width: 100%;
        }

        /* HEADER TEXT STYLE */
        .header-text {
            color: white;
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-weight: bold;
            text-align: center;
            animation: fadeInDown 1.5s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 2. SPECIFIC 464x832 VIDEO CONTAINER */
        .video-wrapper {
            position: relative;
            width: 90vw;
            max-width: 250px;
            aspect-ratio: 464 / 832;
            max-height: 75vh;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .candle-trigger {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            z-index: 11;
            cursor: pointer;
        }

        /* 3. BALLOONS & CONFETTI */
        .balloon {
            position: absolute;
            bottom: -100px;
            width: 40px;
            height: 50px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            pointer-events: none;
            animation: floatUp 8s linear infinite;
        }
        .balloon::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            width: 2px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
        }

        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(-110vh) translateX(50px) rotate(20deg); opacity: 0; }
        }

        .confetti {
            position: absolute;
            top: -20px;
            width: 10px;
            height: 10px;
            pointer-events: none;
            z-index: 20;
            animation: fall 4s linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) translateX(100px) rotate(720deg); opacity: 0; }
        }

        /* 5. POPUP */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
            padding: 20px;
        }

        .popup {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px 25px;
            border-radius: 35px;
            text-align: center;
            color: white;
            width: 100%;
            max-width: 320px; 
            transform: scale(0.7);
            transition: all 0.5s ease;
        }

        .overlay.active { opacity: 1; visibility: visible; }
        .overlay.active .popup { transform: scale(1); }

        .btn-next {
            margin-top: 25px;
            display: inline-block;
            padding: 15px 35px;
            background: #fff;
            color: #4e31aa;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div id="balloon-container"></div>
    <div id="confetti-container"></div>

    <div class="content-container">
        <h1 class="header-text">Happy Birthday Dewndara! ✨
            <br><p style="font-size: medium; margin: 5px 0 0 0;">Click Here</p>
        </h1>
        
        <h3 style="color: navajowhite; margin-top: 0;">touch on the candles to blow them after wish</h3>
        
        <div class="video-wrapper">
            <video id="bg-video" autoplay muted loop playsinline>
                <source src="images/1.mp4" type="video/mp4">
            </video>
            <div class="candle-trigger" id="candleTrigger"></div>
        </div>
    </div>

    <div class="overlay" id="overlay">
        <div class="popup">
            <h2 style="margin-top:0">Make a Wish</h2>
            <p>Close your eyes and let your heart speak. There's also some puzzel waiting for you. click the bellow button</p>
            <a href="puzzel 1.html" class="btn-next">Shhh...</a>
        </div>
    </div>

    <audio id="bg-audio" muted>
        <source src="images/birthday.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('bg-audio');
        const video = document.getElementById('bg-video');
        audio.volume = 0.15;

        let popupEnabled = false;

        const startAudio = () => {
            audio.muted = false;
            audio.play().catch(e => console.log('Autoplay prevented:', e));
            
            if (video) {
                video.currentTime = 0;
                video.play().catch(e => console.log('Video auto-sync prevented:', e));
            }

            document.removeEventListener('click', startAudio);
            document.removeEventListener('keydown', startAudio);
        };
        
        document.addEventListener('click', startAudio);
        document.addEventListener('keydown', startAudio);

        // The popup remains strictly gated by the completion of the background audio track
        audio.addEventListener('ended', () => {
            popupEnabled = true;
        });

        const overlay = document.getElementById('overlay');
        const trigger = document.getElementById('candleTrigger');
        const balloonContainer = document.getElementById('balloon-container');
        const confettiContainer = document.getElementById('confetti-container');

        trigger.addEventListener('click', () => {
            if (popupEnabled) {
                overlay.classList.add('active');
            }
        });

        overlay.addEventListener('click', (e) => {
            if(e.target === overlay) overlay.classList.remove('active');
        });

        function createBalloon() {
            const balloon = document.createElement('div');
            balloon.className = 'balloon';
            const colors = ['#ff4d6d', '#ffb703', '#8ecae6', '#fb8500', '#9d4edd'];
            balloon.style.left = Math.random() * 100 + 'vw';
            balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            balloon.style.animationDuration = (Math.random() * 4 + 6) + 's';
            balloon.style.width = (Math.random() * 20 + 30) + 'px';
            balloon.style.height = (parseFloat(balloon.style.width) * 1.2) + 'px';
            balloonContainer.appendChild(balloon);
            setTimeout(() => balloon.remove(), 10000);
        }

        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 70%, 60%)`;
            confetti.style.animationDuration = (Math.random() * 2 + 3) + 's';
            confettiContainer.appendChild(confetti);
            setTimeout(() => confetti.remove(), 4000);
        }

        setInterval(createBalloon, 1500);
        setInterval(createConfetti, 300);
    </script>
</body>
</html>
